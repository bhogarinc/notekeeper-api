# Logstash Configuration for NoteKeeper Log Processing
# Processes application logs from Filebeat and sends to Elasticsearch

input {
  beats {
    port => 5044
    type => "beats"
  }
  
  tcp {
    port => 5000
    type => "tcp_logs"
    codec => json_lines
  }
  
  http {
    port => 8080
    type => "http_logs"
    codec => json
  }
}

filter {
  # Add common fields
  mutate {
    add_field => {
      "[@metadata][index_prefix]" => "notekeeper"
      "service.name" => "notekeeper-api"
      "service.environment" => "${ENVIRONMENT:production}"
      "service.version" => "${APP_VERSION:unknown}"
      "host.name" => "${HOSTNAME:unknown}"
    }
  }
  
  # Parse JSON logs
  if [message] =~ /^\{/ {
    json {
      source => "message"
      target => "parsed"
      skip_on_invalid_json => true
    }
    
    if [parsed] {
      mutate {
        rename => {
          "[parsed][timestamp]" => "@timestamp"
          "[parsed][level]" => "log.level"
          "[parsed][message]" => "log.message"
          "[parsed][logger]" => "log.logger"
          "[parsed][request_id]" => "trace.id"
          "[parsed][user_id]" => "user.id"
          "[parsed][endpoint]" => "http.endpoint"
          "[parsed][method]" => "http.method"
          "[parsed][status_code]" => "http.status_code"
          "[parsed][duration_ms]" => "event.duration"
          "[parsed][error]" => "error.message"
          "[parsed][stack_trace]" => "error.stack_trace"
        }
        remove_field => ["parsed", "message"]
      }
    }
  }
  
  # Normalize log levels
  if [log.level] {
    mutate {
      uppercase => ["[log.level]"]
    }
    translate {
      field => "[log.level]"
      destination => "[log.level_normalized]"
      dictionary => {
        "DEBUG" => "debug"
        "INFO" => "info"
        "WARNING" => "warn"
        "WARN" => "warn"
        "ERROR" => "error"
        "CRITICAL" => "critical"
        "FATAL" => "critical"
      }
      fallback => "info"
    }
  }
  
  # Extract trace context from headers
  if [headers][x-request-id] {
    mutate {
      add_field => { "trace.id" => "%{[headers][x-request-id]}" }
    }
  }
  
  if [headers][x-trace-id] {
    mutate {
      add_field => { "trace.id" => "%{[headers][x-trace-id]}" }
    }
  }
  
  # Calculate latency buckets for aggregation
  if [event.duration] {
    ruby {
      code => "
        duration = event.get('[event.duration]').to_f
        bucket = case duration
          when 0..10 then '0-10ms'
          when 10..50 then '10-50ms'
          when 50..100 then '50-100ms'
          when 100..250 then '100-250ms'
          when 250..500 then '250-500ms'
          when 500..1000 then '500ms-1s'
          when 1000..2500 then '1-2.5s'
          when 2500..5000 then '2.5-5s'
          else '>5s'
        end
        event.set('[event.latency_bucket]', bucket)
      "
    }
  }
  
  # Categorize errors
  if [log.level_normalized] == "error" or [log.level_normalized] == "critical" {
    if [error.message] {
      mutate {
        add_field => { "error.categorized" => true }
      }
      
      # Pattern matching for common error types
      if [error.message] =~ /connection.*refused/i {
        mutate { add_field => { "error.type" => "connection_refused" } }
      } else if [error.message] =~ /timeout/i {
        mutate { add_field => { "error.type" => "timeout" } }
      } else if [error.message] =~ /authentication|unauthorized|forbidden/i {
        mutate { add_field => { "error.type" => "auth_error" } }
      } else if [error.message] =~ /database|sql|postgres/i {
        mutate { add_field => { "error.type" => "database_error" } }
      } else if [error.message] =~ /validation|invalid/i {
        mutate { add_field => { "error.type" => "validation_error" } }
      } else {
        mutate { add_field => { "error.type" => "unknown" } }
      }
    }
  }
  
  # Enrich with GeoIP (if client IP available)
  if [client.ip] {
    geoip {
      source => "[client.ip]"
      target => "[client.geo]"
      fields => ["city_name", "country_name", "location", "region_name"]
    }
  }
  
  # Parse user agent
  if [user_agent.original] {
    useragent {
      source => "[user_agent.original]"
      target => "[user_agent]"
    }
  }
  
  # Remove sensitive fields
  mutate {
    remove_field => [
      "[headers][authorization]",
      "[headers][cookie]",
      "[headers][x-api-key]",
      "[password]",
      "[token]",
      "[jwt]"
    ]
  }
  
  # Add tags based on content
  if [log.level_normalized] == "error" {
    mutate { add_tag => ["error", "requires_attention"] }
  }
  
  if [http.status_code] and [http.status_code] >= 500 {
    mutate { add_tag => ["server_error", "incident_potential"] }
  }
  
  if [event.duration] and [event.duration] > 2000 {
    mutate { add_tag => ["slow_request", "performance"] }
  }
}

output {
  # Send to Elasticsearch with index routing
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS:localhost:9200}"]
    user => "${ELASTICSEARCH_USER:elastic}"
    password => "${ELASTICSEARCH_PASSWORD:changeme}"
    
    # Dynamic index naming based on log type and date
    index => "%{[@metadata][index_prefix]}-%{+YYYY.MM.dd}"
    
    # Index template management
    template => "/usr/share/logstash/templates/notekeeper-template.json"
    template_name => "notekeeper"
    template_overwrite => true
    
    # Pipeline for additional processing
    pipeline => "notekeeper-logs"
    
    # Batch settings
    flush_size => 500
    idle_flush_time => 10
    
    # Retry settings
    retry_initial_interval => 2
    retry_max_interval => 64
    retry_on_conflict => 3
    
    # Health check
    healthcheck_path => "/_cluster/health"
    healthcheck_interval => 30
  }
  
  # Output critical errors to separate index for alerting
  if [log.level_normalized] in ["error", "critical"] {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOSTS:localhost:9200}"]
      user => "${ELASTICSEARCH_USER:elastic}"
      password => "${ELASTICSEARCH_PASSWORD:changeme}"
      index => "%{[@metadata][index_prefix]}-errors-%{+YYYY.MM.dd}"
    }
  }
  
  # Debug output for development
  if "${LOGSTASH_DEBUG:false}" == "true" {
    stdout {
      codec => rubydebug { metadata => true }
    }
  }
}
