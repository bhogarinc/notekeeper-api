openapi: 3.0.3
info:
  title: NoteKeeper API
  description: |
    A secure note-taking REST API application with categories, tags, 
    full-text search, and markdown support.
  version: 1.0.0
  contact:
    name: NoteKeeper Support
    email: support@notekeeper.app

servers:
  - url: https://notekeeper-bhogarai.azurewebsites.net/api/v1
    description: Production server
  - url: http://localhost:8000/api/v1
    description: Development server

security:
  - BearerAuth: []

paths:
  /auth/register:
    post:
      summary: Register a new user
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/login:
    post:
      summary: Login user
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      summary: Refresh access token
      tags:
        - Authentication
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      summary: Logout user
      tags:
        - Authentication
      responses:
        '204':
          description: Logout successful

  /notes:
    get:
      summary: List notes
      tags:
        - Notes
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Search query
        - name: category_id
          in: query
          schema:
            type: string
            format: uuid
        - name: is_pinned
          in: query
          schema:
            type: boolean
        - name: is_archived
          in: query
          schema:
            type: boolean
            default: false
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: List of notes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotesResponse'

    post:
      summary: Create a new note
      tags:
        - Notes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteCreate'
      responses:
        '201':
          description: Note created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'

  /notes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      summary: Get a note by ID
      tags:
        - Notes
      responses:
        '200':
          description: Note details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Update a note
      tags:
        - Notes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteUpdate'
      responses:
        '200':
          description: Note updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'

    delete:
      summary: Delete a note
      tags:
        - Notes
      responses:
        '204':
          description: Note deleted

  /notes/{id}/pin:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Pin or unpin a note
      tags:
        - Notes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteStatusUpdate'
      responses:
        '200':
          description: Pin status updated

  /notes/{id}/archive:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Archive or unarchive a note
      tags:
        - Notes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteStatusUpdate'
      responses:
        '200':
          description: Archive status updated

  /categories:
    get:
      summary: List categories
      tags:
        - Categories
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'

    post:
      summary: Create a category
      tags:
        - Categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
      responses:
        '201':
          description: Category created

  /categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      summary: Update a category
      tags:
        - Categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
      responses:
        '200':
          description: Category updated
    delete:
      summary: Delete a category
      tags:
        - Categories
      responses:
        '204':
          description: Category deleted

  /tags:
    get:
      summary: List tags
      tags:
        - Tags
      responses:
        '200':
          description: List of tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagResponse'

    post:
      summary: Create a tag
      tags:
        - Tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCreate'
      responses:
        '201':
          description: Tag created

  /tags/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      summary: Delete a tag
      tags:
        - Tags
      responses:
        '204':
          description: Tag deleted

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserCreate:
      type: object
      required:
        - email
        - username
        - password
      properties:
        email:
          type: string
          format: email
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: '^[a-zA-Z0-9_]+$'
        password:
          type: string
          minLength: 8
          maxLength: 128

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        username:
          type: string
        is_active:
          type: boolean
        is_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: bearer
        expires_in:
          type: integer
          example: 1800
        user:
          $ref: '#/components/schemas/UserResponse'

    TokenRefreshResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer

    NoteCreate:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          maxLength: 200
        content:
          type: string
        category_id:
          type: string
          format: uuid
        tag_ids:
          type: array
          items:
            type: string
            format: uuid
        is_pinned:
          type: boolean
          default: false

    NoteUpdate:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        content:
          type: string
        category_id:
          type: string
          format: uuid
        tag_ids:
          type: array
          items:
            type: string
            format: uuid

    NoteStatusUpdate:
      type: object
      properties:
        is_pinned:
          type: boolean
        is_archived:
          type: boolean

    NoteResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: string
        is_pinned:
          type: boolean
        is_archived:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        user_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagResponse'

    PaginatedNotesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NoteResponse'
        pagination:
          type: object
          properties:
            next_cursor:
              type: string
            has_more:
              type: boolean
            limit:
              type: integer
            total_count:
              type: integer

    CategoryCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 50
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          default: '#6366f1'
        icon:
          type: string
          maxLength: 50
        parent_id:
          type: string
          format: uuid

    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
        color:
          type: string
        icon:
          type: string
        parent_id:
          type: string
          format: uuid

    CategoryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
        icon:
          type: string
        parent_id:
          type: string
          format: uuid
        note_count:
          type: integer

    TagCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 30
          pattern: '^[a-zA-Z0_\-]+$'
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          default: '#10b981'

    TagResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
        note_count:
          type: integer

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
